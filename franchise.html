<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franchise Application | Vedha Varshini Wellness</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-layout">
    <div class="auth-visual" style="background: url('https://images.unsplash.com/photo-1600880292203-757bb62b4baf?auto=format&fit=crop&q=80') center/cover; position: relative;">
        <div style="position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(16, 107, 51, 0.85);"></div>
        <div class="auth-visual-content">
            <h2>Partner With Us</h2>
            <p>Bring premium preventive wellness and nutrition to your city. Join our growing franchise network today.</p>
        </div>
    </div>
    <div class="auth-form-side">
        <div class="auth-form-container" style="max-width: 500px; position: relative;">
            <div style="text-align: left; margin-bottom: 2rem;">
                <a href="index.html" style="color: #666; text-decoration: none; font-size: 0.95rem; font-weight: 500; display: inline-flex; align-items: center; gap: 5px;">
                    &larr; Back to Home
                </a>
            </div>
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <a href="index.html" style="text-decoration: none; display: inline-block;">
                    <img src="logo.png" alt="Vedha Varshini Wellness Logo" style="height: 70px; margin-bottom: 5px; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                    <h3 style="color: var(--color-text);">Franchise Application</h3>
                </a>
            </div>
            
            <form id="franchiseForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>
                
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="Email">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" name="phone" required placeholder="Phone Number">
                    </div>
                </div>

                <div class="form-group">
                    <label for="city">Target City / Location</label>
                    <input type="text" id="city" name="city" required placeholder="Where do you want to open?">
                </div>

                <div class="form-group">
                    <label for="investment">Investment Budget</label>
                    <select id="investment" name="investment" style="width: 100%; padding: 12px; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; background: #FAFAF5; font-family: inherit;">
                        <option value="">Select your budget range</option>
                        <option value="5L - 10L">₹5 Lakhs - ₹10 Lakhs</option>
                        <option value="10L - 25L">₹10 Lakhs - ₹25 Lakhs</option>
                        <option value="25L+">Above ₹25 Lakhs</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message (Optional)</label>
                    <textarea id="message" name="message" rows="3" placeholder="Tell us a bit about your background..." style="width: 100%; padding: 12px; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; background: #FAFAF5; font-family: inherit; resize: vertical;"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary w-full" style="margin-top: 10px; padding: 14px;">Submit Application</button>
            </form>
            
            <div style="margin-top: 20px; text-align: center;">
                <a href="index.html" class="btn btn-outline w-full" style="display:flex; justify-content:center; align-items:center; gap:8px;">
                    &larr; Back to Homepage
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('franchiseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Sending...';
            btn.disabled = true;
            
            setTimeout(() => {
                alert("Application submitted successfully! (Static HTML Version)");
                document.getElementById('franchiseForm').reset();
                btn.textContent = 'Submit Application';
                btn.disabled = false;
            }, 800);
        });
    </script>
</body>
</html>
